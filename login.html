<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Pelatih KP14</title><link rel="stylesheet" href="style.css?v=firebase14"></head><body><main class="landing"><section class="panel login-card"><p class="eyebrow">MOD PELATIH • FIREBASE</p><h1>LOGIN PELATIH</h1><label>Nama Penuh<input id="nameInput" type="text" placeholder="Masukkan nama penuh"></label><label>ID Pelatih<input id="idInput" type="text" placeholder="Masukkan ID pelatih"></label><fieldset><legend>Pilih Avatar</legend><div class="avatar-grid"><button type="button" class="avatar selected" data-avatar="🧑‍💻">🧑‍💻</button><button type="button" class="avatar" data-avatar="👩‍💻">👩‍💻</button><button type="button" class="avatar" data-avatar="🧑‍🔧">🧑‍🔧</button><button type="button" class="avatar" data-avatar="👩‍🔧">👩‍🔧</button><button type="button" class="avatar" data-avatar="🤖">🤖</button><button type="button" class="avatar" data-avatar="🦸">🦸</button></div></fieldset><p id="loginMessage" class="message"></p><button id="loginButton" class="primary full" type="button">SIMPAN DAN TERUSKAN</button></section></main><script src="storage.js?v=firebase14"></script><script type="module">import{C01FirebaseStorage}from'./firebase-storage.js';let avatar='🧑‍💻';document.querySelectorAll('.avatar').forEach(b=>b.onclick=()=>{document.querySelectorAll('.avatar').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');avatar=b.dataset.avatar});loginButton.onclick=async()=>{const name=nameInput.value.trim(),id=idInput.value.trim();if(!name||!id){loginMessage.textContent='Sila masukkan nama dan ID.';return}loginButton.disabled=true;loginButton.textContent='SEDANG MENYIMPAN...';try{const p=C01K14Storage.saveProfile({name,id,avatar,language:'ms'});await C01FirebaseStorage.saveStudentProfile({name,id,studentId:id,avatar,language:'ms',xp:p.xp,coins:p.coins,currentMission:14,repository:location.pathname.split('/').filter(Boolean)[0]});location.href='dashboard.html'}catch(e){console.error(e);loginMessage.textContent='Login Firebase gagal.';loginButton.disabled=false;loginButton.textContent='SIMPAN DAN TERUSKAN'}};</script></body></html>
