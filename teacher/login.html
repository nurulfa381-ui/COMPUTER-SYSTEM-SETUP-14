<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Guru</title><link rel="stylesheet" href="style.css"></head><body><main class="center"><section class="panel"><h1>LOGIN PEGAWAI PENILAI</h1><input id="name" placeholder="Nama Pegawai Penilai"><input id="pin" type="password" placeholder="PIN"><p id="msg"></p><button id="go">LOG MASUK</button><p>PIN awal: 1515</p></section></main><script type="module">import{ensureFirebaseLogin}from'../firebase-config.js';go.onclick=async()=>{if(!name.value.trim()||pin.value!==(localStorage.getItem('c01_teacher_pin_v2')||'1515')){msg.textContent='Nama atau PIN tidak tepat.';return}await ensureFirebaseLogin();sessionStorage.setItem('c01_teacher_session_v2',JSON.stringify({name:name.value.trim()}));location.href='dashboard.html'};</script></body></html>
